<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic tac toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav >
        <ul>
            <li>TicTacToe.com</li>
        </ul>
    </nav>
   <div class="game-container">
    <div class="container">
        <div class="box" id="box1"><span class="boxtext"></span></div>
        <div class="box" id="box2"><span class="boxtext"></span></div>
        <div class="box" id="box3"><span class="boxtext"></span></div>
        <div class="box" id="box4"><span class="boxtext"></span></div>
        <div class="box" id="box5"><span class="boxtext"></span></div>
        <div class="box" id="box6"><span class="boxtext"></span></div>
        <div class="box" id="box7"><span class="boxtext"></span></div>
        <div class="box" id="box8"><span class="boxtext"></span></div>
        <div class="box" id="box9"><span class="boxtext"></span></div>
    </div>
    <div class="gameinfo">
        <h1>Welcome To Tic Tac Toe</h1>
        <button class="btn" id="reset">Reset Game</button>
        <span id="info"></span>
        <div class="imgBox"><img src="excited.gif" id="vid" class="hidden" width="200" height="200" autoplay muted></img></div>
        .
    </div>

   </div>
            
    <script src="script_fixed.js"></script>
</body>
</html>
